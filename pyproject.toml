[project]
name = "customer-churn-alert-agent"
version = "0.1.0"
description = "Churn early-warning: XGBoost ranks at-risk customers, an LLM multi-agent investigates why, and every claim is verified against the database"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "azure-identity>=1.25.3",
    "deepagents>=0.6.12",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain-google-genai>=4.3.1",
    "langchain-google-vertexai>=3.2.4",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.6.2",
    "pandas>=3.0.5",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.9.0",
    "shap>=0.52.0",
    "uvicorn[standard]>=0.53.0",
    "xgboost>=3.3.0",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# run from the repo root so `import churn` resolves; tests live in tests/
pythonpath = ["."]
testpaths = ["tests"]
